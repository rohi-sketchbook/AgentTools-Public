name: Public release audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Audit distributable files, history, and portable defaults
        run: |
          node agenttools-mcp-gateway/scripts/public-release-audit.js
          node agenttools-mcp-gateway/scripts/history-secret-audit.js
          node agenttools-mcp-gateway/scripts/config-portability-test.js
          node agenttools-mcp-gateway/scripts/github-workflow-permissions-audit.js
